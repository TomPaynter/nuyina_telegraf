[[inputs.tail]]
# [[inputs.file]]
#   watch_method = "inotify"
  from_beginning = true
  # Path from fluent_ctd.conf
  files = ["/flat_files/ctd/ctd-*.txt"]
  name_override = "ctd"
  data_format = "grok"

 grok_patterns = [
    '''^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"},<Scan index='(?:%{NUMBER:scan_index_ctd:float})?'><Field0>(?:%{NUMBER:scan_count_ctd:float})?</Field0><Field1>(?:%{NUMBER:sea_water_pressure_ctd:float})?</Field1><Field2>(?:%{NUMBER:sea_water_temperature_primary_ctd:float})?</Field2><Field3>(?:%{NUMBER:sea_water_temperature_secondary_ctd:float})?</Field3><Field4>(?:%{NUMBER:sea_water_electrical_conductivity_primary_ctd:float})?</Field4><Field5>(?:%{NUMBER:sea_water_electrical_conductivity_secondary_ctd:float})?</Field5><Field6>(?:%{NUMBER:depth_m_ctd:float})?</Field6><Field7>(?:%{NUMBER:speed_of_sound_in_sea_water_primary_ctd:float})?</Field7><Field8>(?:%{NUMBER:speed_of_sound_in_sea_water_secondary_ctd:float})?</Field8><Field9>(?:%{NUMBER:photosynthetically_active_radiation_ctd:float})?</Field9><Field10>(?:%{NUMBER:height_above_sea_floor_primary_ctd:float})?</Field10><Field11>(?:%{NUMBER:height_above_sea_floor_secondary_ctd:float})?</Field11><Field12>(?:%{NUMBER:descent_rate_ctd:float})?</Field12><Field13>(?:%{NUMBER:sea_water_salinity_primary_ctd:float})?</Field13><Field14>(?:%{NUMBER:sea_water_salinity_secondary_ctd:float})?</Field14></Scan>.*'''
  ]

[[processors.converter]]
  namepass = ["ctd"]
  [processors.converter.fields]
    # Converting the floats back to integers as defined in the original 'types' section
    integer = [
      "scan_index_ctd", 
      "scan_count_ctd", 
      "sea_water_pressure_ctd"
    ]

# If there were lat/lon fields in the CTD file, the starlark processor would go here.
# Based on the fluent_ctd.conf provided, it only contains sensor data and indices.