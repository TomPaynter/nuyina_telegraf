[[inputs.tail]]
  watch_method = "inotify"
  from_beginning = true
  # Paths derived from fluentd source definitions
  files = ["/flat_files/aws430_pfa/aws430_pfa-*.txt", "/flat_files/aws430_sf/aws430_sf-*.txt"]
  
  name_override = "aws430"
  data_format = "grok"

  grok_patterns = [
    # Port & Fore Meteorology (Derived from pfa.conf Pattern 1)
    '^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"}.\(S:AWS430_2_PS;D:(?:%{NUMBER})?.*;T:(?:%{NUMBER})?.*;RNAME:RT;STATUS2:(?:%{NUMBER:aws_status_port:float})?.*;EXTDC2:(?:%{NUMBER:aws_power_port:float})?.*;TASTAT2:(?:%{NUMBER:air_temperature_status_port:float})?.*;TAAVG1M2:(?:%{NUMBER:air_temperature_avg1minute_port:float})?.*;TASTAT3:(?:%{NUMBER:air_temperature_status_fore:float})?.*;TAAVG1M3:(?:%{NUMBER:air_temperature_avg1minute_fore:float})?.*;RHSTAT2:(?:%{NUMBER:relative_humidity_status_port:float})?.*;RHAVG1M2:(?:%{NUMBER:relative_humidity_avg1minute_port:float})?.*;RHSTAT3:(?:%{NUMBER:relative_humidity_status_fore:float})?.*;RHAVG1M3:(?:%{NUMBER:relative_humidity_avg1minute_fore:float})?.*;DPAVG1M2:(?:%{NUMBER:dew_point_temperature_avg1minute_port:float})?.*;DPAVG1M3:(?:%{NUMBER:dew_point_temperature_avg1minute_fore:float})?.*;SRAVG1M2:(?:%{NUMBER:solar_irradiance_avg1minute_port:float})?.*;UVAVG1M2:(?:%{NUMBER:uv_irradiance_avg1minute_port:float})?.*;PARAVG1M2:(?:%{NUMBER:photosynthetically_active_radiation_avg1minute_port:float})?.*;LWAVG1M2:(?:%{NUMBER:longwave_irradiance_avg1minute_port:float})?.*;UVBAVG1M2:(?:%{NUMBER:uvb_irradiation_avg1minute_port:float})?.*',

    # Starboard, Pressure, Cloud & Precip (Derived from sf.conf Pattern 2)
    '^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"}.\(S:AWS430_1_SB;D:(?:%{NUMBER})?.*;T:(?:%{NUMBER})?.*;RNAME:RT;STATUS1:(?:%{NUMBER:aws_status_stbd:float})?.*;EXTDC1:(?:%{NUMBER:aws_power_stbd:float})?.*;TASTAT1:(?:%{NUMBER:air_temperature_status_stbd:float})?.*;TAAVG1M1:(?:%{NUMBER:air_temperature_avg1minute_stbd:float})?.*;RHSTAT1:(?:%{NUMBER:relative_humidity_status_stbd:float})?.*;RHAVG1M1:(?:%{NUMBER:relative_humidity_avg1minute_stbd:float})?.*;DPAVG1M1:(?:%{NUMBER:dew_point_temperature_avg1minute_stbd:float})?.*;PAAVG1M1:(?:%{NUMBER:air_pressure_avg1minute:float})?.*;QNHAVG1M1:(?:%{NUMBER:air_pressure_avg1minute_qnh:float})?.*;QFEAVG1M1:(?:%{NUMBER:air_pressure_avg1minute_qfe:float})?.*;PTEND:(?:%{NUMBER:air_pressure_tend3hour:float})?.*;PTREND:(?:%{NUMBER:air_pressure_trend3hour:float})?.*;SRAVG1M1:(?:%{NUMBER:solar_irradiance_avg1minute_stbd:float})?.*;UVAVG1M1:(?:%{NUMBER:uv_irradiance_avg1minute_stbd:float})?.*;PARAVG1M1:(?:%{NUMBER:photosynthetically_active_radiation_avg1minute_stbd:float})?.*;LWAVG1M1:(?:%{NUMBER:longwave_irradiance_avg1minute_stbd:float})?.*;UVBAVG1M1:(?:%{NUMBER:uvb_irradiation_avg1minute_stbd:float})?.*;CL_STATUSCODE:(?:%{NUMBER:cloud_height_status:float})?.*;CL_BASE1:(?:%{NUMBER:cloud_base_1_cl31:float})?.*;CL_BASE2:(?:%{NUMBER:cloud_base_2_cl31:float})?.*;CL_BASE3:(?:%{NUMBER:cloud_base_3_cl31:float})?.*;CL1:(?:%{NUMBER:cloud_height_1:float})?.*;CL2:(?:%{NUMBER:cloud_height_2:float})?.*;CL3:(?:%{NUMBER:cloud_height_3:float})?.*;CL4:(?:%{NUMBER:cloud_height_4:float})?.*;CL5:(?:%{NUMBER:cloud_height_5:float})?.*;SC1:(?:%{NUMBER:cloud_cover_1:float})?.*;SC2:(?:%{NUMBER:cloud_cover_2:float})?.*;SC3:(?:%{NUMBER:cloud_cover_3:float})?.*;SC4:(?:%{NUMBER:cloud_cover_4:float})?.*;SC5:(?:%{NUMBER:cloud_cover_5:float})?.*;PWD_WARNING:(?:%{NUMBER:pwd_warning:float})?.*;PWD_VISALARM:(?:%{NUMBER:pwd_visalarm:float})?.*;VIS:(?:%{NUMBER:visibility_in_air_avg1minute:float})?.*;VISAVG10M:(?:%{NUMBER:visibility_in_air_avg10minute:float})?.*;PW:(?:%{NUMBER:present_weather:float})?.*;PW15M:(?:%{NUMBER:present_weather_avg15minute:float})?.*;PRSUM1M:(?:%{NUMBER:precipitation_accumulation_1minute:float})?.*;PRSUM1H:(?:%{NUMBER:precipitation_accumulation_1hour:float})?.*;PRFAVG1M:(?:%{NUMBER:precipitation_rate_avg1minute:float})?.*;SNOWINC:(?:%{NUMBER:snow_accumulation_1minute:float})?.*',

    # Wind Aft (Derived from pfa.conf Pattern 2)
    '^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"}.\(S:AWS430_2_PS;D:(?:%{NUMBER})?.*;T:(?:%{NUMBER})?.*;RNAME:RT;WS2:(?:%{NUMBER:wind_speed_true_aft:float})?.*WSAVG2M2:(?:%{NUMBER:wind_speed_true_avg2minute_aft:float})?.*WSMAX2M2:(?:%{NUMBER:wind_speed_true_max2minute_aft:float})?.*WSMIN2M2:(?:%{NUMBER:wind_speed_true_min2minute_aft:float})?.*WSAVG10M2:(?:%{NUMBER:wind_speed_true_avg10minute_aft:float})?.*WSMAX10M2:(?:%{NUMBER:wind_speed_true_max10minute_aft:float})?.*WSMIN10M2:(?:%{NUMBER:wind_speed_true_min10minute_aft:float})?.*WSGUST10M2:(?:%{NUMBER:wind_speed_true_gust10minute_aft:float})?.*WSR2:(?:%{NUMBER:wind_speed_relative_aft:float})?.*WSRAVG2M2:(?:%{NUMBER:wind_speed_relative_avg2minute_aft:float})?.*WSRMAX2M2:(?:%{NUMBER:wind_speed_relative_max2minute_aft:float})?.*WSRMIN2M2:(?:%{NUMBER:wind_speed_relative_min2minute_aft:float})?.*WSRAVG10M2:(?:%{NUMBER:wind_speed_relative_avg10minute_aft:float})?.*WSRMAX10M2:(?:%{NUMBER:wind_speed_relative_max10minute_aft:float})?.*WSRMIN10M2:(?:%{NUMBER:wind_speed_relative_min10minute_aft:float})?.*WD2:(?:%{NUMBER:wind_from_direction_true_aft:float})?.*WDAVG2M2:(?:%{NUMBER:wind_from_direction_true_avg2minute_aft:float})?.*WDMAX2M2:(?:%{NUMBER:wind_from_direction_true_max2minute_aft:float})?.*WDMIN2M2:(?:%{NUMBER:wind_from_direction_true_min2minute_aft:float})?.*WDAVG10M2:(?:%{NUMBER:wind_from_direction_true_avg10minute_aft:float})?.*WDMAX10M2:(?:%{NUMBER:wind_from_direction_true_max10minute_aft:float})?.*WDMIN10M2:(?:%{NUMBER:wind_from_direction_true_min10minute_aft:float})?.*WDGUST10M2:(?:%{NUMBER:wind_from_direction_true_gust10minute_aft:float})?.*WDR2:(?:%{NUMBER:wind_from_direction_relative_aft:float})?.*WDRAVG2M2:(?:%{NUMBER:wind_from_direction_relative_avg2minute_aft:float})?.*WDRMAX2M2:(?:%{NUMBER:wind_from_direction_relative_max2minute_aft:float})?.*WDRMIN2M2:(?:%{NUMBER:wind_from_direction_relative_min2minute_aft:float})?.*WDRAVG10M2:(?:%{NUMBER:wind_from_direction_relative_avg10minute_aft:float})?.*WDRMAX10M2:(?:%{NUMBER:wind_from_direction_relative_max10minute_aft:float})?.*WDRMIN10M2:(?:%{NUMBER:wind_from_direction_relative_min10minute_aft:float})?.*',

    # Wind Fore 1 (Derived from pfa.conf Pattern 3)
    '^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"}.\(S:AWS430_2_PS;D:(?:%{NUMBER})?.*;T:(?:%{NUMBER})?.*;RNAME:RT;WS3:(?:%{NUMBER:wind_speed_true_fore_1:float})?.*WSAVG2M3:(?:%{NUMBER:wind_speed_true_avg2minute_fore_1:float})?.*WSMAX2M3:(?:%{NUMBER:wind_speed_true_max2minute_fore_1:float})?.*WSMIN2M3:(?:%{NUMBER:wind_speed_true_min2minute_fore_1:float})?.*WSAVG10M3:(?:%{NUMBER:wind_speed_true_avg10minute_fore_1:float})?.*WSMAX10M3:(?:%{NUMBER:wind_speed_true_max10minute_fore_1:float})?.*WSMIN10M3:(?:%{NUMBER:wind_speed_true_min10minute_fore_1:float})?.*WSGUST10M3:(?:%{NUMBER:wind_speed_true_gust10minute_fore_1:float})?.*WSR3:(?:%{NUMBER:wind_speed_relative_fore_1:float})?.*WSRAVG2M3:(?:%{NUMBER:wind_speed_relative_avg2minute_fore_1:float})?.*WSRMAX2M3:(?:%{NUMBER:wind_speed_relative_max2minute_fore_1:float})?.*WSRMIN2M3:(?:%{NUMBER:wind_speed_relative_min2minute_fore_1:float})?.*WSRAVG10M3:(?:%{NUMBER:wind_speed_relative_avg10minute_fore_1:float})?.*WSRMAX10M3:(?:%{NUMBER:wind_speed_relative_max10minute_fore_1:float})?.*WSRMIN10M3:(?:%{NUMBER:wind_speed_relative_min10minute_fore_1:float})?.*WD3:(?:%{NUMBER:wind_from_direction_true_fore_1:float})?.*WDAVG2M3:(?:%{NUMBER:wind_from_direction_true_avg2minute_fore_1:float})?.*WDMAX2M3:(?:%{NUMBER:wind_from_direction_true_max2minute_fore_1:float})?.*WDMIN2M3:(?:%{NUMBER:wind_from_direction_true_min2minute_fore_1:float})?.*WDAVG10M3:(?:%{NUMBER:wind_from_direction_true_avg10minute_fore_1:float})?.*WDMAX10M3:(?:%{NUMBER:wind_from_direction_true_max10minute_fore_1:float})?.*WDMIN10M3:(?:%{NUMBER:wind_from_direction_true_min10minute_fore_1:float})?.*WDGUST10M3:(?:%{NUMBER:wind_from_direction_true_gust10minute_fore_1:float})?.*WDR3:(?:%{NUMBER:wind_from_direction_relative_fore_1:float})?.*WDRAVG2M3:(?:%{NUMBER:wind_from_direction_relative_avg2minute_fore_1:float})?.*WDRMAX2M3:(?:%{NUMBER:wind_from_direction_relative_max2minute_fore_1:float})?.*WDRMIN2M3:(?:%{NUMBER:wind_from_direction_relative_min2minute_fore_1:float})?.*WDRAVG10M3:(?:%{NUMBER:wind_from_direction_relative_avg10minute_fore_1:float})?.*WDRMAX10M3:(?:%{NUMBER:wind_from_direction_relative_max10minute_fore_1:float})?.*WDRMIN10M3:(?:%{NUMBER:wind_from_direction_relative_min10minute_fore_1:float})?.*',

    # Wind Fore 2 (Derived from sf.conf Pattern 3)
    '^%{TIMESTAMP_ISO8601:timestamp:ts-"2006-01-02T15:04:05.000000Z"}.\(S:AWS430_1_SB;D:(?:%{NUMBER})?.*;T:(?:%{NUMBER})?.*;RNAME:RT;WS1:(?:%{NUMBER:wind_speed_true_fore_2:float})?.*WSAVG2M1:(?:%{NUMBER:wind_speed_true_avg2minute_fore_2:float})?.*WSMAX2M1:(?:%{NUMBER:wind_speed_true_max2minute_fore_2:float})?.*WSMIN2M1:(?:%{NUMBER:wind_speed_true_min2minute_fore_2:float})?.*WSAVG10M1:(?:%{NUMBER:wind_speed_true_avg10minute_fore_2:float})?.*WSMAX10M1:(?:%{NUMBER:wind_speed_true_max10minute_fore_2:float})?.*WSMIN10M1:(?:%{NUMBER:wind_speed_true_min10minute_fore_2:float})?.*WSGUST10M1:(?:%{NUMBER:wind_speed_true_gust10minute_fore_2:float})?.*WSR1:(?:%{NUMBER:wind_speed_relative_fore_2:float})?.*WSRAVG2M1:(?:%{NUMBER:wind_speed_relative_avg2minute_fore_2:float})?.*WSRMAX2M1:(?:%{NUMBER:wind_speed_relative_max2minute_fore_2:float})?.*WSRMIN2M1:(?:%{NUMBER:wind_speed_relative_min2minute_fore_2:float})?.*WSRAVG10M1:(?:%{NUMBER:wind_speed_relative_avg10minute_fore_2:float})?.*WSRMAX10M1:(?:%{NUMBER:wind_speed_relative_max10minute_fore_2:float})?.*WSRMIN10M1:(?:%{NUMBER:wind_speed_relative_min10minute_fore_2:float})?.*WD1:(?:%{NUMBER:wind_from_direction_true_fore_2:float})?.*WDAVG2M1:(?:%{NUMBER:wind_from_direction_true_avg2minute_fore_2:float})?.*WDMAX2M1:(?:%{NUMBER:wind_from_direction_true_max2minute_fore_2:float})?.*WDMIN2M1:(?:%{NUMBER:wind_from_direction_true_min2minute_fore_2:float})?.*WDAVG10M1:(?:%{NUMBER:wind_from_direction_true_avg10minute_fore_2:float})?.*WDMAX10M1:(?:%{NUMBER:wind_from_direction_true_max10minute_fore_2:float})?.*WDMIN10M1:(?:%{NUMBER:wind_from_direction_true_min10minute_fore_2:float})?.*WDGUST10M1:(?:%{NUMBER:wind_from_direction_true_gust10minute_fore_2:float})?.*WDR1:(?:%{NUMBER:wind_from_direction_relative_fore_2:float})?.*WDRAVG2M1:(?:%{NUMBER:wind_from_direction_relative_avg2minute_fore_2:float})?.*WDRMAX2M1:(?:%{NUMBER:wind_from_direction_relative_max2minute_fore_2:float})?.*WDRMIN2M1:(?:%{NUMBER:wind_from_direction_relative_min2minute_fore_2:float})?.*WDRAVG10M1:(?:%{NUMBER:wind_from_direction_relative_avg10minute_fore_2:float})?.*WDRMAX10M1:(?:%{NUMBER:wind_from_direction_relative_max10minute_fore_2:float})?.*WDRMIN10M1:(?:%{NUMBER:wind_from_direction_relative_min10minute_fore_2:float})?.*',

    # Ignore text after literal * and potential white space at end of line
    # '.*\*.*'
  ]

[[processors.converter]]
  namepass = ["aws430"]
  [processors.converter.fields]
    # Converting floats to integers as per original config types
    integer = [
      "aws_status_port", "air_temperature_status_port", "air_temperature_status_fore", 
      "relative_humidity_status_port", "relative_humidity_avg1minute_port", 
      "relative_humidity_status_fore", "relative_humidity_avg1minute_fore", 
      "solar_irradiance_avg1minute_port", "uv_irradiance_avg1minute_port", 
      "photosynthetically_active_radiation_avg1minute_port", "longwave_irradiance_avg1minute_port",
      "aws_status_stbd", "air_temperature_status_stbd", "relative_humidity_status_stbd", 
      "relative_humidity_avg1minute_stbd", "solar_irradiance_avg1minute_stbd", 
      "uv_irradiance_avg1minute_stbd", "photosynthetically_active_radiation_avg1minute_stbd", 
