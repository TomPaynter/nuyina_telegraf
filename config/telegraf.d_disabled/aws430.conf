      "wind_from_direction_true_min10minute_aft", "wind_from_direction_true_gust10minute_aft", 
      "wind_from_direction_relative_aft", "wind_from_direction_relative_avg2minute_aft", 
      "wind_from_direction_relative_max2minute_aft", "wind_from_direction_relative_min2minute_aft", 
      "wind_from_direction_relative_avg10minute_aft", "wind_from_direction_relative_max10minute_aft", 
      "wind_from_direction_relative_min10minute_aft",
      "wind_from_direction_true_fore_1", "wind_from_direction_true_avg2minute_fore_1", 
      "wind_from_direction_true_max2minute_fore_1", "wind_from_direction_true_min2minute_fore_1", 
      "wind_from_direction_true_avg10minute_fore_1", "wind_from_direction_true_max10minute_fore_1", 
      "wind_from_direction_true_min10minute_fore_1", "wind_from_direction_true_gust10minute_fore_1", 
      "wind_from_direction_relative_fore_1", "wind_from_direction_relative_avg2minute_fore_1", 
      "wind_from_direction_relative_max2minute_fore_1", "wind_from_direction_relative_min2minute_fore_1", 
      "wind_from_direction_relative_avg10minute_fore_1", "wind_from_direction_relative_max10minute_fore_1", 
      "wind_from_direction_relative_min10minute_fore_1",
      "wind_from_direction_true_fore_2", "wind_from_direction_true_avg2minute_fore_2", 
      "wind_from_direction_true_max2minute_fore_2", "wind_from_direction_true_min2minute_fore_2", 
      "wind_from_direction_true_avg10minute_fore_2", "wind_from_direction_true_max10minute_fore_2", 
      "wind_from_direction_true_min10minute_fore_2", "wind_from_direction_true_gust10minute_fore_2", 
      "wind_from_direction_relative_fore_2", "wind_from_direction_relative_avg2minute_fore_2", 
      "wind_from_direction_relative_max2minute_fore_2", "wind_from_direction_relative_min2minute_fore_2", 
      "wind_from_direction_relative_avg10minute_fore_2", "wind_from_direction_relative_max10minute_fore_2", 
      "wind_from_direction_relative_min10minute_fore_2"
    ]